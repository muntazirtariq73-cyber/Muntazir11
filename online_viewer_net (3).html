<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Contact Form</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

button{
    background:#007BFF;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    justify-content:center;
    align-items:center;
}

.popup-content{
    background:#fff;
    padding:20px;
    width:320px;
    border-radius:10px;
    position:relative;
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    font-size:24px;
    cursor:pointer;
}

input,textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

.submit-btn{
    width:100%;
    background:#28a745;
}
</style>

</head>

<body>

<button onclick="document.getElementById('popup').style.display='flex'">
Open Contact Form
</button>

<div class="popup" id="popup">

<div class="popup-content">

<span class="close"
onclick="document.getElementById('popup').style.display='none'">&times;</span>

<h2>Contact Form</h2>

<form action="https://formsubmit.co/YOUR_EMAIL@gmail.com" method="POST">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="New Website Contact">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="https://thankyou.page/">

<input type="text" name="Name" placeholder="Muntazir tariq" required>
l
<input type="email" name="Email" placeholder="muntazirtariq789@gmail.com" required>

<textarea name="Message" placeholder="Your Message" rows="5" required></textarea>

<button type="submit" class="submit-btn">
Submit
</button>

</form>

</div>

</div>

<script>
window.onclick=function(event){
if(event.target==document.getElementById("popup")){
document.getElementById("popup").style.display="none";
}
}
</script>

</body>
</html>
